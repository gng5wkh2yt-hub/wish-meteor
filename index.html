<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#04050e">
<title>许愿 · 所愿皆所成</title>
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
html,body{
  height:100%;overflow:hidden;background:#04050e;
  font-family:"Songti SC","STSong","SimSun","Noto Serif SC",serif;
  -webkit-font-smoothing:antialiased;
  -webkit-tap-highlight-color:transparent;
  -webkit-user-select:none;user-select:none;
  -webkit-touch-callout:none;
}
input{-webkit-user-select:text;user-select:text}
#sky{position:fixed;inset:0;display:block;touch-action:none}

/* ---------- 顶部标题 ---------- */
.brand{
  position:fixed;left:0;right:0;
  top:calc(env(safe-area-inset-top,0px) + 8vh);
  text-align:center;pointer-events:none;user-select:none;z-index:4;
  animation:fadeUp 2.4s .3s cubic-bezier(.2,.8,.3,1) both;
}
@keyframes fadeUp{
  from{opacity:0;transform:translateY(18px)}
  to{opacity:1;transform:translateY(0)}
}
.brand h1{
  font-size:clamp(22px,4.8vw,32px);font-weight:400;
  letter-spacing:.5em;text-indent:.5em;
  color:rgba(255,247,228,.92);
  text-shadow:0 0 24px rgba(255,222,152,.55),0 0 70px rgba(130,165,255,.32);
}
.brand p{
  margin-top:16px;font-size:clamp(10px,2.3vw,12px);
  letter-spacing:.36em;text-indent:.36em;
  color:rgba(196,212,255,.4);
}

/* ---------- 底部坞：愿望堆叠 + 输入框 ---------- */
.dock{
  position:fixed;
  /* 用 left/right + auto margin 居中，把 transform 完全让给动画，
     否则抖动动画一旦覆盖 transform，容器就会横移出屏 */
  left:0;right:0;margin-inline:auto;
  bottom:calc(env(safe-area-inset-bottom,0px) + 6vh);
  width:min(620px,calc(100vw - 32px));
  display:flex;flex-direction:column;gap:16px;
  z-index:6;
  opacity:0;transform:translateY(24px);
  transition:opacity 1.6s cubic-bezier(.2,.8,.3,1),
             transform 1.6s cubic-bezier(.2,.8,.3,1);
}
.dock.ready{opacity:1;transform:translateY(0)}

/* ============ 愿望堆叠 ============ */
.stack{position:relative;isolation:isolate}
.stack[hidden]{display:none}

.stack-body{
  position:relative;
  display:flex;flex-direction:column;gap:9px;
}
.stack.open .stack-body{
  max-height:44vh;overflow-y:auto;overflow-x:hidden;
  padding:2px 2px 4px;
  -webkit-overflow-scrolling:touch;
  scrollbar-width:thin;
  scrollbar-color:rgba(255,255,255,.18) transparent;
}
.stack.open .stack-body::-webkit-scrollbar{width:5px}
.stack.open .stack-body::-webkit-scrollbar-thumb{
  background:rgba(255,255,255,.18);border-radius:99px;
}
.stack.open .stack-body::-webkit-scrollbar-track{background:transparent}

/* 折叠态：只留最上面一张，底下露出玻璃边 */
.stack:not(.open) .stack-body{overflow:visible}
.stack:not(.open) .stack-body .wish-bubble:not(:first-child){display:none}
.stack.has-more:not(.open) .stack-body::before,
.stack.has-more:not(.open) .stack-body::after{
  content:'';position:absolute;z-index:0;
  left:50%;height:calc(100% - 6px);
  border-radius:24px;
  border:1px solid rgba(255,255,255,.1);
  background:rgba(255,255,255,.045);
  -webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);
  transform:translateX(-50%);
  pointer-events:none;
}
.stack.has-more:not(.open) .stack-body::before{
  bottom:-9px;width:calc(100% - 26px);
}
.stack.has-more:not(.open) .stack-body::after{
  bottom:-17px;width:calc(100% - 54px);opacity:.6;
}

.stack-foot{
  display:none;align-items:center;justify-content:center;gap:7px;
  margin-top:9px;padding:6px 0 2px;
  font-size:12px;letter-spacing:.2em;text-indent:.2em;
  color:rgba(186,204,248,.5);
  background:none;border:0;font-family:inherit;cursor:pointer;
  transition:color .3s;
}
.stack.has-more .stack-foot{display:flex}
.stack-foot:hover{color:rgba(220,232,255,.82)}
.stack-foot .chev{
  display:inline-block;font-size:9px;line-height:1;
  transition:transform .45s cubic-bezier(.2,.8,.3,1);
}
.stack.open .stack-foot .chev{transform:rotate(180deg)}

/* ---- 液态玻璃气泡 ---- */
.wish-bubble{
  position:relative;z-index:1;
  padding:15px 42px 15px 20px;
  border-radius:24px;
  background:
    linear-gradient(148deg,
      rgba(255,255,255,.17) 0%,
      rgba(255,255,255,.055) 44%,
      rgba(255,255,255,.11) 100%);
  -webkit-backdrop-filter:blur(22px) saturate(185%);
  backdrop-filter:blur(22px) saturate(185%);
  border:1px solid rgba(255,255,255,.17);
  box-shadow:
    inset 0 1px 1px rgba(255,255,255,.5),
    inset 0 -1px 1px rgba(255,255,255,.1),
    inset 1px 0 1px rgba(255,255,255,.13),
    inset -1px 0 1px rgba(255,255,255,.08),
    0 10px 34px rgba(0,0,0,.36),
    0 0 46px rgba(150,190,255,.07);
  transition:transform .45s cubic-bezier(.2,.9,.3,1),
             box-shadow .45s, opacity .45s;
}
/* 玻璃顶面高光 */
.wish-bubble::before{
  content:'';position:absolute;inset:1px 1px auto;
  height:52%;pointer-events:none;
  border-radius:23px 23px 58% 58% / 23px 23px 34% 34%;
  background:linear-gradient(180deg,
    rgba(255,255,255,.17) 0%,
    rgba(255,255,255,.04) 62%,
    rgba(255,255,255,0) 100%);
}
.wish-bubble:hover{
  transform:translateY(-1px);
  box-shadow:
    inset 0 1px 1px rgba(255,255,255,.6),
    inset 0 -1px 1px rgba(255,255,255,.12),
    0 14px 40px rgba(0,0,0,.4),
    0 0 60px rgba(170,205,255,.12);
}

.wb-text{
  position:relative;z-index:1;
  font-size:15px;line-height:1.45;letter-spacing:.05em;
  color:rgba(255,251,243,.96);
  text-shadow:0 0 18px rgba(255,232,180,.28);
  word-break:break-word;
}
.wb-time{
  position:relative;z-index:1;
  margin-top:5px;font-size:11px;letter-spacing:.16em;
  color:rgba(190,206,244,.54);
}

.wb-del{
  position:absolute;top:50%;right:11px;
  transform:translateY(-50%);
  z-index:2;
  width:26px;height:26px;border-radius:50%;
  display:grid;place-items:center;
  border:1px solid rgba(255,255,255,.14);
  background:rgba(255,255,255,.07);
  color:rgba(232,240,255,.62);
  font-size:15px;line-height:1;font-family:inherit;
  cursor:pointer;opacity:0;
  transition:opacity .3s,background .3s,color .3s,transform .25s;
}
.stack.open .wb-del{opacity:1}
.wish-bubble:hover .wb-del{opacity:1}
.wb-del:hover{
  background:rgba(255,120,120,.26);
  border-color:rgba(255,150,150,.42);
  color:#fff;transform:translateY(-50%) scale(1.08);
}
.wb-del:active{transform:translateY(-50%) scale(.94)}

/* 触摸设备常显删除键 */
@media (hover:none){
  .stack.open .wb-del{opacity:.9}
}

/* 新气泡：光束凝成玻璃 */
@keyframes condense{
  0%{
    opacity:0;transform:translateY(-72px) scale(.46);
    filter:blur(15px) brightness(2.7);
  }
  46%{
    opacity:1;transform:translateY(4px) scale(1.055);
    filter:blur(0) brightness(1.95);
  }
  72%{
    transform:translateY(-2px) scale(.988);
    filter:blur(0) brightness(1.22);
  }
  100%{
    opacity:1;transform:translateY(0) scale(1);
    filter:blur(0) brightness(1);
  }
}
.wish-bubble.new{animation:condense .98s cubic-bezier(.2,.9,.3,1) both}

@keyframes bubbleOut{
  to{opacity:0;transform:translateX(26px) scale(.82);filter:blur(6px)}
}
.wish-bubble.removing{
  animation:bubbleOut .42s cubic-bezier(.4,0,.7,.3) both;
  pointer-events:none;
}

/* ============ 输入条 ============ */
.wishbar{display:flex;gap:12px;align-items:center}

.wishbar input{
  flex:1;min-width:0;height:56px;padding:0 26px;
  border-radius:999px;
  border:1px solid rgba(188,208,255,.2);
  background:rgba(255,255,255,.055);
  -webkit-backdrop-filter:blur(18px) saturate(160%);
  backdrop-filter:blur(18px) saturate(160%);
  color:rgba(255,249,236,.97);
  font-family:inherit;font-size:16px;letter-spacing:.06em;
  outline:none;
  box-shadow:0 10px 44px rgba(0,0,0,.42),inset 0 1px 0 rgba(255,255,255,.065);
  transition:border-color .45s,background .45s,box-shadow .45s,
             opacity .55s ease,transform .55s cubic-bezier(.2,.8,.3,1);
}
.wishbar input::placeholder{color:rgba(178,194,236,.42);letter-spacing:.16em}
.wishbar input:focus{
  border-color:rgba(255,224,162,.48);
  background:rgba(255,255,255,.085);
  box-shadow:0 10px 48px rgba(0,0,0,.46),
             0 0 0 3px rgba(255,214,132,.1),
             inset 0 1px 0 rgba(255,255,255,.1);
}

#releaseBtn{
  flex:0 0 auto;height:56px;padding:0 30px;
  border-radius:999px;
  border:1px solid rgba(255,226,168,.42);
  background:linear-gradient(140deg,rgba(255,238,200,.2),rgba(255,196,112,.13));
  -webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);
  color:#fff5de;font-family:inherit;font-size:16px;
  letter-spacing:.26em;text-indent:.26em;
  cursor:pointer;
  box-shadow:0 0 32px rgba(255,196,112,.16),inset 0 1px 0 rgba(255,255,255,.15);
  transition:transform .28s cubic-bezier(.2,.9,.3,1.25),box-shadow .35s,
             opacity .55s ease;
}
#releaseBtn:hover{
  transform:translateY(-2px);
  box-shadow:0 0 46px rgba(255,196,112,.36),inset 0 1px 0 rgba(255,255,255,.22);
}
#releaseBtn:active{transform:translateY(0) scale(.965)}
#releaseBtn:disabled{opacity:.4;cursor:default;transform:none;box-shadow:none}

.dock.sending .wishbar input,
.dock.sending #releaseBtn,
.dock.sending .stack-foot{
  opacity:0;transform:translateY(-10px) scale(.96);pointer-events:none;
}
.stack-foot{transition:opacity .5s,transform .5s,color .3s}

/* 空输入抖动 */
.dock.shake{animation:shake .5s cubic-bezier(.36,.07,.19,.97)}
@keyframes shake{
  0%,100%{transform:translateY(0)}
  10%,90%{transform:translateX(-3px)}
  20%,80%{transform:translateX(5px)}
  30%,50%,70%{transform:translateX(-7px)}
  40%,60%{transform:translateX(7px)}
}

/* ---------- 成功提示气泡 ---------- */
.bubble{
  position:fixed;left:50%;top:44%;
  transform:translate(-50%,-50%) scale(.84);
  opacity:0;pointer-events:none;z-index:8;
  padding:24px 44px 28px;border-radius:28px;
  background:linear-gradient(152deg,rgba(255,251,241,.96),rgba(255,238,206,.92));
  box-shadow:0 24px 80px rgba(255,186,104,.3),
             0 0 0 1px rgba(255,255,255,.55) inset,
             0 0 90px rgba(255,214,140,.22);
  text-align:center;
  transition:opacity .75s cubic-bezier(.2,.8,.3,1),
             transform .75s cubic-bezier(.2,.9,.3,1.14);
}
.bubble.show{opacity:1;transform:translate(-50%,-50%) scale(1)}
.bubble::after{
  content:'';position:absolute;left:50%;bottom:-8px;
  width:18px;height:18px;transform:translateX(-50%) rotate(45deg);
  background:rgba(255,243,220,.94);border-radius:0 0 5px 0;
}
.bubble .b-main{
  font-size:clamp(21px,4.6vw,28px);letter-spacing:.3em;text-indent:.3em;
  color:#5c3d0e;white-space:nowrap;
  text-shadow:0 1px 0 rgba(255,255,255,.7);
}
.bubble .b-sub{
  margin-top:13px;font-size:clamp(13px,2.9vw,16px);
  letter-spacing:.36em;text-indent:.36em;color:#9d7742;white-space:nowrap;
}

/* ---------- 窄屏：别让「放飞」被挤扁 ---------- */
@media (max-width:390px){
  .wishbar{gap:9px}
  .wishbar input{padding:0 17px;font-size:15px}
  .wishbar input::placeholder{letter-spacing:.08em;font-size:14px}
  #releaseBtn{padding:0 19px;font-size:15px;letter-spacing:.16em;text-indent:.16em}
  .wb-text{font-size:14px}
  .wb-time{font-size:10px}
}
@media (max-width:330px){
  .wishbar input::placeholder{content:''}
  #releaseBtn{padding:0 15px;letter-spacing:.1em;text-indent:.1em}
}

/* ---------- 矮屏（横屏手机等）：收起副标题，压缩列表 ---------- */
@media (max-height:600px){
  .brand{top:calc(env(safe-area-inset-top,0px) + 5vh)}
  .brand p{display:none}
  .dock{bottom:calc(env(safe-area-inset-bottom,0px) + 3.5vh)}
  .stack.open .stack-body{max-height:34vh}
}
@media (max-height:420px){
  .stack.open .stack-body{max-height:28vh}
  .wishbar input,#releaseBtn{height:48px}
  .brand h1{font-size:20px}
}
</style>
</head>
<body>
<canvas id="sky"></canvas>

<div class="brand">
  <h1>许愿</h1>
  <p>写下来 让它飞向夜空</p>
</div>

<div class="dock" id="dock">

  <div class="stack" id="stack" hidden>
    <div class="stack-body" id="stackBody"></div>
    <button class="stack-foot" id="stackFoot" type="button">
      <span id="stackLabel">共 1 个愿望</span>
      <span class="chev">▼</span>
    </button>
  </div>

  <div class="wishbar">
    <input id="wishInput" type="text" maxlength="24"
           placeholder="输入你的愿望…" autocomplete="off"
           spellcheck="false" enterkeyhint="send">
    <button id="releaseBtn" type="button">放飞</button>
  </div>

</div>

<div class="bubble" id="bubble">
  <div class="b-main">许愿成功</div>
  <div class="b-sub">所愿皆所成</div>
</div>

<script>
(() => {
'use strict';

const cvs    = document.getElementById('sky');
const ctx    = cvs.getContext('2d');
const input  = document.getElementById('wishInput');
const btn    = document.getElementById('releaseBtn');
const bubble = document.getElementById('bubble');
const dock   = document.getElementById('dock');
const stack  = document.getElementById('stack');
const stackBody = document.getElementById('stackBody');
const stackFoot = document.getElementById('stackFoot');
const stackLabel= document.getElementById('stackLabel');

let W = 0, H = 0, DPR = 1;
let stars = [];
let bgMeteors = [];
let hero = null;
let heroAlpha = 0;
let busy = false;
let time = 0, last = 0, bgTimer = 0;
let storm = 0, stormTarget = 0;      // 长按背景时的流星雨强度 0→1

/* 背景流星：方向与颜色统一，只有速度/长度/明暗保留随机，
   这样既整齐又有层次；暖金的愿望流星才好从冷色流星雨里跳出来 */
let bgAngle = Math.PI * 0.78;
const BG_COLOR = [205, 226, 255];

const rand  = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;

/* ==================================================================
   愿望存储 —— localStorage，天然按设备/浏览器隔离
   ================================================================== */
const STORE_KEY = 'wish-meteor:wishes:v1';
const MAX_KEEP  = 200;
const MAX_RENDER= 60;

let storeOK = true;
try {
  localStorage.setItem('__wm_probe__', '1');
  localStorage.removeItem('__wm_probe__');
} catch (e) { storeOK = false; }

function loadWishes() {
  if (!storeOK) return [];
  try {
    const raw = localStorage.getItem(STORE_KEY);
    if (!raw) return [];
    const arr = JSON.parse(raw);
    if (!Array.isArray(arr)) return [];
    return arr.filter(w => w && typeof w.text === 'string' && w.text.trim());
  } catch (e) { return []; }
}

function persist() {
  if (!storeOK) return;
  try {
    localStorage.setItem(STORE_KEY, JSON.stringify(wishes.slice(0, MAX_KEEP)));
  } catch (e) { /* 配额满或隐私模式，静默降级 */ }
}

let wishes = loadWishes();   // 新的在前

/* ---------------- 时间格式化 ---------------- */
function fmtTime(ts) {
  const d = new Date(ts);
  const now = new Date();
  const hm = String(d.getHours()).padStart(2, '0') + ':' +
             String(d.getMinutes()).padStart(2, '0');
  const day = x => x.getFullYear() + '/' + x.getMonth() + '/' + x.getDate();
  if (day(d) === day(now)) return '今天 ' + hm;
  const y = new Date(now); y.setDate(y.getDate() - 1);
  if (day(d) === day(y)) return '昨天 ' + hm;
  if (d.getFullYear() === now.getFullYear())
    return (d.getMonth() + 1) + '月' + d.getDate() + '日 ' + hm;
  return d.getFullYear() + '年' + (d.getMonth() + 1) + '月' + d.getDate() + '日';
}

/* ==================================================================
   气泡堆叠渲染
   ================================================================== */
let stackOpen = false;

function renderStack(newId) {
  if (!wishes.length) {
    stack.hidden = true;
    stackBody.innerHTML = '';
    return;
  }
  stack.hidden = false;

  const list = stackOpen ? wishes.slice(0, MAX_RENDER) : wishes.slice(0, 1);

  stack.classList.toggle('open', stackOpen);
  stack.classList.toggle('has-more', wishes.length > 1);
  stackLabel.textContent = stackOpen ? '收起' : ('共 ' + wishes.length + ' 个愿望');

  stackBody.innerHTML = list.map(w => `
    <div class="wish-bubble${w.id === newId ? ' new' : ''}" data-id="${w.id}">
      <div class="wb-text"></div>
      <div class="wb-time">${fmtTime(w.ts)}</div>
      <button class="wb-del" type="button" aria-label="删除这个愿望">✕</button>
    </div>
  `).join('');

  // 文字用 textContent 写入，避免任何注入
  const nodes = stackBody.querySelectorAll('.wish-bubble');
  list.forEach((w, i) => {
    nodes[i].querySelector('.wb-text').textContent = w.text;
  });
}

function addWish(text) {
  const w = {
    id: 'w' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7),
    text: text.slice(0, 24),
    ts: Date.now()
  };
  wishes.unshift(w);
  if (wishes.length > MAX_KEEP) wishes.length = MAX_KEEP;
  persist();
  stackOpen = false;
  renderStack(w.id);
  return w;
}

function removeWish(id) {
  const el = stackBody.querySelector(`.wish-bubble[data-id="${id}"]`);
  const drop = () => {
    wishes = wishes.filter(w => w.id !== id);
    persist();
    renderStack(null);
  };
  if (el) {
    el.classList.add('removing');
    setTimeout(drop, 400);
  } else drop();
}

stackBody.addEventListener('click', e => {
  const del = e.target.closest('.wb-del');
  if (del) {
    e.stopPropagation();
    removeWish(del.closest('.wish-bubble').dataset.id);
  }
});

function toggleStack(force) {
  const next = typeof force === 'boolean' ? force : !stackOpen;
  if (next === stackOpen) return;
  stackOpen = next;
  renderStack(null);
}

stackFoot.addEventListener('click', e => { e.stopPropagation(); toggleStack(); });
stackBody.addEventListener('click', e => {
  if (!stackOpen && !e.target.closest('.wb-del')) toggleStack(true);
});

/* ==================================================================
   画布尺寸 / 星空
   ================================================================== */
function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth;
  H = window.innerHeight;
  cvs.width  = Math.round(W * DPR);
  cvs.height = Math.round(H * DPR);
  cvs.style.width  = W + 'px';
  cvs.style.height = H + 'px';
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  bgAngle = Math.atan2(H * 0.92, -W);   // 与愿望流星同一角度，全屏平行
  buildStars();
}

function buildStars() {
  const n = clamp(Math.round(W * H / 3400), 160, 640);
  stars = [];
  for (let i = 0; i < n; i++) {
    const p = Math.random();
    const color = p < 0.68 ? [255, 255, 255]
                : p < 0.88 ? [186, 212, 255]
                           : [255, 226, 174];
    stars.push({
      x: Math.random() * W,
      y: Math.random() * H,
      r: rand(0.4, 1.45),
      base: rand(0.24, 0.88),
      phase: Math.random() * Math.PI * 2,
      speed: rand(0.35, 1.5),
      color
    });
  }
}

function drawSky() {
  const g = ctx.createLinearGradient(0, 0, W * 0.32, H);
  g.addColorStop(0,   '#04050e');
  g.addColorStop(0.46,'#070b1e');
  g.addColorStop(1,   '#0e0b26');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);

  ctx.globalCompositeOperation = 'lighter';
  nebula(W * 0.2,  H * 0.26, Math.max(W, H) * 0.46, 'rgba(70,94,196,0.11)');
  nebula(W * 0.84, H * 0.74, Math.max(W, H) * 0.4,  'rgba(148,84,190,0.085)');
  ctx.globalCompositeOperation = 'source-over';
}

function nebula(x, y, r, color) {
  const g = ctx.createRadialGradient(x, y, 0, x, y, r);
  g.addColorStop(0, color);
  g.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = g;
  ctx.fillRect(x - r, y - r, r * 2, r * 2);
}

function drawStars() {
  for (let i = 0; i < stars.length; i++) {
    const s = stars[i];
    const a = s.base * (0.55 + 0.45 * Math.sin(time * s.speed + s.phase));
    ctx.fillStyle = `rgba(${s.color[0]},${s.color[1]},${s.color[2]},${a})`;
    ctx.beginPath();
    ctx.arc(s.x, s.y, s.r, 0, 6.2832);
    ctx.fill();
  }
}

/* ==================================================================
   背景流星
   ================================================================== */
function spawnBgMeteor() {
  const ang   = bgAngle;
  const speed = rand(300, 700) * (1 + storm * 1.05);
  bgMeteors.push({
    x: rand(W * 0.02, W * 1.12),
    y: rand(-H * 0.32, H * 0.3),
    vx: Math.cos(ang) * speed,
    vy: Math.sin(ang) * speed,
    len: rand(100, 300) * (1 + storm * 0.35),
    width: rand(0.7, 2) * (1 + storm * 0.22),
    alpha: Math.min(rand(0.3, 0.86) * (1 + storm * 0.18), 1),
    color: BG_COLOR,
    life: 0,
    maxLife: rand(2.4, 5)
  });
}

function drawMeteor(m, a) {
  const sp = Math.hypot(m.vx, m.vy) || 1;
  const ux = m.vx / sp, uy = m.vy / sp;
  const tx = m.x - ux * m.len;
  const ty = m.y - uy * m.len;
  const r = m.color[0], gg = m.color[1], b = m.color[2];

  const g = ctx.createLinearGradient(m.x, m.y, tx, ty);
  g.addColorStop(0,    `rgba(255,255,255,${a})`);
  g.addColorStop(0.1,  `rgba(${r},${gg},${b},${a * 0.75})`);
  g.addColorStop(0.5,  `rgba(${r},${gg},${b},${a * 0.18})`);
  g.addColorStop(1,    `rgba(${r},${gg},${b},0)`);
  ctx.strokeStyle = g;
  ctx.lineWidth = m.width;
  ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(m.x, m.y);
  ctx.lineTo(tx, ty);
  ctx.stroke();

  const hr = m.width * 3.6;
  const hg = ctx.createRadialGradient(m.x, m.y, 0, m.x, m.y, hr);
  hg.addColorStop(0,   `rgba(255,255,255,${a})`);
  hg.addColorStop(0.34,`rgba(${r},${gg},${b},${a * 0.55})`);
  hg.addColorStop(1,   `rgba(${r},${gg},${b},0)`);
  ctx.fillStyle = hg;
  ctx.beginPath();
  ctx.arc(m.x, m.y, hr, 0, 6.2832);
  ctx.fill();
}

/* ==================================================================
   主流星（愿望升空）
   ================================================================== */
function launchWish(text) {
  // 与背景流星严格同角度：自右上角斜穿向左下角
  const ang = bgAngle;
  const ux = Math.cos(ang), uy = Math.sin(ang);   // ux<0, uy>0

  const m  = Math.min(W, H) * 0.3;
  const sx = W + m * 0.8;    // 从屏幕右上外侧切入
  const sy = -m * 0.5;

  let D = Infinity;
  if (ux < 0) D = Math.min(D, (-160 - sx) / ux);
  if (uy > 0) D = Math.min(D, (H + 160 - sy) / uy);
  if (!isFinite(D) || D <= 0) D = Math.hypot(W, H);

  hero = {
    sx, sy, x: sx, y: sy,
    dx: ux * D * 1.02,
    dy: uy * D * 1.02,
    ux, uy,
    age: 0,
    duration: 2.8,                 // 固定时长，划得慢一点看得清
    maxLen: Math.min(W, H) * 0.62,
    trail: 0,
    text
  };
  heroAlpha = 0;
  return hero.duration;
}

function updateHero(dt) {
  if (!hero) return;
  hero.age += dt;
  const t = hero.age / hero.duration;

  if (t >= 1 || hero.x < -260 || hero.y > H + 260) {
    hero = null;
    heroAlpha = 0;
    return;
  }

  const e = t * (0.6 + 0.4 * t);        // 平缓加速，不再末尾狂冲
  hero.x = hero.sx + hero.dx * e;
  hero.y = hero.sy + hero.dy * e;

  hero.trail = Math.max(hero.maxLen * (0.35 + 0.65 * t), 40);
  heroAlpha = clamp(t / 0.14, 0, 1);
}

function drawHero() {
  if (!hero) return;
  const a = heroAlpha;

  ctx.save();
  ctx.globalCompositeOperation = 'lighter';

  const glowR = Math.min(W, H) * 0.17;
  const og = ctx.createRadialGradient(hero.x, hero.y, 0, hero.x, hero.y, glowR);
  og.addColorStop(0,   `rgba(255,228,168,${a * 0.4})`);
  og.addColorStop(0.4, `rgba(255,198,110,${a * 0.14})`);
  og.addColorStop(1,   'rgba(255,190,100,0)');
  ctx.fillStyle = og;
  ctx.beginPath(); ctx.arc(hero.x, hero.y, glowR, 0, 6.2832); ctx.fill();

  const tx = hero.x - hero.ux * hero.trail;
  const ty = hero.y - hero.uy * hero.trail;
  const g = ctx.createLinearGradient(hero.x, hero.y, tx, ty);
  g.addColorStop(0,    `rgba(255,252,240,${a * 0.95})`);
  g.addColorStop(0.09, `rgba(255,230,170,${a * 0.7})`);
  g.addColorStop(0.34, `rgba(255,204,124,${a * 0.24})`);
  g.addColorStop(0.72, `rgba(220,180,255,${a * 0.07})`);
  g.addColorStop(1,    'rgba(200,170,255,0)');
  ctx.strokeStyle = g;
  ctx.lineWidth = Math.min(W, H) * 0.012;
  ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(hero.x, hero.y); ctx.lineTo(tx, ty); ctx.stroke();

  const g2 = ctx.createLinearGradient(hero.x, hero.y, tx, ty);
  g2.addColorStop(0,   `rgba(255,255,255,${a})`);
  g2.addColorStop(0.22,`rgba(255,246,220,${a * 0.5})`);
  g2.addColorStop(1,   'rgba(255,240,200,0)');
  ctx.strokeStyle = g2;
  ctx.lineWidth = Math.min(W, H) * 0.0035;
  ctx.beginPath(); ctx.moveTo(hero.x, hero.y); ctx.lineTo(tx, ty); ctx.stroke();

  const hr = Math.min(W, H) * 0.032;
  const hg = ctx.createRadialGradient(hero.x, hero.y, 0, hero.x, hero.y, hr);
  hg.addColorStop(0,   `rgba(255,255,255,${a})`);
  hg.addColorStop(0.3, `rgba(255,240,200,${a * 0.8})`);
  hg.addColorStop(1,   'rgba(255,214,140,0)');
  ctx.fillStyle = hg;
  ctx.beginPath(); ctx.arc(hero.x, hero.y, hr, 0, 6.2832); ctx.fill();

  ctx.restore();

  if (hero.text && a > 0.02) {
    const len = hero.text.length;
    const fs = clamp(Math.min(W * 0.86 / len, H * 0.05), 13, 30);
    const ty2 = hero.y - fs * 1.5;
    ctx.save();
    ctx.font = `400 ${fs}px "Songti SC","STSong","SimSun",serif`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.shadowColor = `rgba(255,226,158,${a * 0.95})`;
    ctx.shadowBlur = 28;
    ctx.fillStyle = `rgba(255,252,242,${a})`;
    ctx.fillText(hero.text, hero.x, ty2);
    ctx.shadowBlur = 0;
    ctx.fillText(hero.text, hero.x, ty2);
    ctx.restore();
  }
}

/* ==================================================================
   主循环
   ================================================================== */
function frame(now) {
  const dt = Math.min((now - last) / 1000, 0.05);
  last = now;
  time += dt;

  drawSky();
  drawStars();

  // 长按背景 → 流星雨增强，松开后平滑回落
  storm += (stormTarget - storm) * (1 - Math.exp(-dt * 4.5));
  if (storm < 0.003) storm = 0;

  bgTimer += dt;
  if (bgTimer >= rand(0.16, 0.62) * (1 - storm * 0.78)) {
    bgTimer = 0;
    if (bgMeteors.length < 90) {
      spawnBgMeteor();
      if (Math.random() < 0.45 + storm * 0.5 && bgMeteors.length < 90) spawnBgMeteor();
    }
  }

  ctx.globalCompositeOperation = 'lighter';

  for (let i = bgMeteors.length - 1; i >= 0; i--) {
    const m = bgMeteors[i];
    m.x += m.vx * dt;
    m.y += m.vy * dt;
    m.life += dt;

    const out = m.x < -400 || m.x > W + 400 || m.y > H + 400 || m.y < -400;
    if (out || m.life > m.maxLife) { bgMeteors.splice(i, 1); continue; }

    let a = m.alpha;
    if (m.life < 0.3) a *= m.life / 0.3;
    const rest = m.maxLife - m.life;
    if (rest < 0.7) a *= Math.max(0, rest / 0.7);

    drawMeteor(m, a);
  }

  updateHero(dt);
  drawHero();

  ctx.globalCompositeOperation = 'source-over';
  requestAnimationFrame(frame);
}

/* ==================================================================
   交互
   ================================================================== */
function release() {
  if (busy) return;
  const text = input.value.trim();
  if (!text) {
    dock.classList.remove('shake');
    void dock.offsetWidth;
    dock.classList.add('shake');
    input.placeholder = '先写下你的愿望…';
    input.focus();
    return;
  }

  busy = true;
  btn.disabled = true;
  input.blur();
  dock.classList.add('sending');
  toggleStack(false);

  const dur = launchWish(text);

  // 用固定时序驱动落地与提示，而不是挂在动画帧上：
  // 页面切到后台时 rAF 会被浏览器暂停，定时器不会 —— 愿望不能因此丢掉
  const landAt = dur * 1000 + 180;
  setTimeout(() => addWish(text), landAt);
  setTimeout(showBubble, landAt + 700);

  input.value = '';
  input.placeholder = '输入你的愿望…';
}

function showBubble() {
  bubble.classList.add('show');
  // 提示还在飘，但输入区先解锁 —— 想连着许几个愿不用干等
  setTimeout(() => {
    busy = false;
    btn.disabled = false;
    dock.classList.remove('sending');
  }, 500);
  setTimeout(() => bubble.classList.remove('show'), 2900);
}

btn.addEventListener('click', release);
input.addEventListener('keydown', e => {
  if (e.key === 'Enter') { e.preventDefault(); release(); }
});
window.addEventListener('resize', resize);

/* ---- 长按星空背景：流星增多、加速 ---- */
const UI_SEL = 'input, button, .wish-bubble, .stack, .bubble';
function stormPress(e) {
  if (e.target && e.target.closest && e.target.closest(UI_SEL)) return;
  stormTarget = 1;
}
function stormRelease() { stormTarget = 0; }

window.addEventListener('pointerdown', stormPress, { passive: true });
window.addEventListener('pointerup', stormRelease, { passive: true });
window.addEventListener('pointercancel', stormRelease, { passive: true });
window.addEventListener('blur', stormRelease);
document.addEventListener('visibilitychange', () => {
  if (document.hidden) stormRelease();
});

/* ==================================================================
   启动
   ================================================================== */
resize();
renderStack(null);
setTimeout(() => dock.classList.add('ready'), 1100);   // 入场淡入
requestAnimationFrame(t => { last = t; requestAnimationFrame(frame); });

})();
</script>
</body>
</html>
